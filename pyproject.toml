[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rangectl"
version = "0.1.0"
description = "Rapid Automated Network Generation and Environment Control"
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
libvirt = ["libvirt-python>=10.0"]
dev = ["pytest>=8.0", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rangectl*"]
exclude = ["tests*", "scratch*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
